server {
    listen 80;
    server_name renzi.zixu.ac.cn;

    root /www/wwwroot/renzi/admin/dist;
    index index.html;
    charset utf-8;

    access_log  /www/wwwlogs/renzi.zixu.ac.cn.log;
    error_log   /www/wwwlogs/renzi.zixu.ac.cn.error.log;

    client_max_body_size 100m;
    client_body_buffer_size 256k;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /api {
        proxy_pass http://127.0.0.1:8086/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /h5 {
        return 301 /h5/;
    }

    location ^~ /h5/ {
        alias /www/wwwroot/renzi/H5/web/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
