# ========================================
# KAdmin 开发环境配置
# ========================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kadmin?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# 开发环境日志级别
logging:
  level:
    root: info
    com.kadmin: debug
    com.kadmin.mapper: debug

# 开发环境开启 SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
