# ========================================
# KAdmin 生产环境配置
# 所有敏感信息通过环境变量注入
# ========================================

server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:kadmin}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# 生产环境日志级别
logging:
  level:
    root: warn
    com.kadmin: info

# 生产环境关闭 Swagger
knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false

