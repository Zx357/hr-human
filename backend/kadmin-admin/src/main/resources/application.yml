# ========================================
# KAdmin 通用配置
# 环境相关配置请参见 application-{profile}.yml
# ========================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: kadmin

  # 激活的配置环境（可通过启动参数覆盖：--spring.profiles.active=prod）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 文件上传大小限制（与 file.upload.max-size 保持一致）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 数据源通用配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 通用配置
  data:
    redis:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Jackson 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.kadmin.system.domain,com.kadmin.hr.domain,com.kadmin.attendance.domain,com.kadmin.organization.domain,com.kadmin.mobile.domain
  global-config:
    db-config:
      id-type: auto
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# JWT 配置（密钥请通过环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:change-me-in-production-with-a-long-random-string}
  expiration: 86400000 # 24 小时
  refresh-expiration: 604800000 # 7 天
  header: Authorization
  prefix: Bearer

# 日志配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Knife4j / SpringDoc 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.kadmin.web.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表

# 文件上传配置
file:
  upload:
    path: ./uploads
    max-size: 10MB
    allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx

# 安全配置
security:
  cors:
    # 允许的跨域来源（逗号分隔，生产环境请通过环境变量/配置收敛为实际域名）
    allowed-origins: ${CORS_ORIGINS:http://localhost:9527,http://127.0.0.1:9527,http://localhost:5173,http://127.0.0.1:5173}
